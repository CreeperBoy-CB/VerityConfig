modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
logoFile = "pack.png"

# YACL 是 Verity 配置界面的渲染库，本模组用同一套 API 搭中文界面。
# 装了 Verity 的玩家一定有它；这里声明出来只是为了让缺失时给出明确提示，
# 而不是在点开配置界面时才抛 NoClassDefFoundError。
[[dependencies.${mod_id}]]
    modId = "yet_another_config_lib_v3"
    mandatory = false
    versionRange = "[3.6.6,)"
    ordering = "AFTER"
    side = "CLIENT"
